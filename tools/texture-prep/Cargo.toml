[package]
name = "texture-prep"
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
description = "Builds assets/textures/lunar_albedo_4096x2048.png from the LROC WAC GMM 100 m tiles"
publish = false

[[bin]]
name = "texture-prep"
path = "src/main.rs"

# Exact versions; transitive dependencies are fixed by Cargo.lock (build with --locked).
# The build needs no C toolchain: no dependency may have a build script or proc macro,
# because those need a host linker. For that reason tiff stays at 0.9.1 and Cargo.lock
# holds crc32fast at 1.4.2 (later releases of both add a build script or proc macro).
[dependencies]
tiff = "=0.9.1"
png = { version = "=0.18.1", default-features = false }

[profile.release]
opt-level = 3
